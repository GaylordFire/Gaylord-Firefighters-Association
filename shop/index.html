<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GFA Supporter Shirt — Gaylord Firefighters' Association</title>
  <meta name="description" content="Charcoal supporter shirt, $20. Proceeds support GFA programs, firefighter training, equipment, and community initiatives." />

  <!-- ══════════════════════════════════════════════════════════
       A short link for sharing: gaylordfire.org/shop

       Everything below the redirect exists for Facebook, Messenger
       and the like. Those crawlers read these tags without running
       any JavaScript, so the preview card is built from here while
       a real visitor is sent straight to the shop on the homepage.
       ══════════════════════════════════════════════════════════ -->
  <meta property="og:type"        content="product" />
  <meta property="og:site_name"   content="Gaylord Firefighters' Association" />
  <meta property="og:title"       content="GFA Supporter Shirt — $20" />
  <meta property="og:description" content="Wear it around town and show your support for the crew. Proceeds from every shirt support GFA programs, firefighter training, equipment, and community initiatives." />
  <meta property="og:image"       content="https://gaylordfire.org/images/shirt.jpg" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="1600" />
  <meta property="og:image:alt"   content="Charcoal Gaylord Firefighters' Association shirt with the Association seal printed across the back" />
  <meta property="og:url"         content="https://gaylordfire.org/shop/" />

  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="GFA Supporter Shirt — $20" />
  <meta name="twitter:description" content="Proceeds support GFA programs, firefighter training, equipment, and community initiatives." />
  <meta name="twitter:image"       content="https://gaylordfire.org/images/shirt.jpg" />

  <link rel="canonical" href="https://gaylordfire.org/#shop" />
  <link rel="icon" type="image/png" sizes="64x64" href="/images/favicon.png" />

  <!-- Sends a person on to the shop. Crawlers ignore this and read
       the tags above, which is exactly what we want. -->
  <meta http-equiv="refresh" content="0; url=/#shop" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0D0C0B;
      color: #9A9189;
      font-family: 'DM Sans', Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    a { color: #E83A2F; }
  </style>
</head>
<body>

  <!-- Seen only if the redirect does not fire. -->
  <p>
    Taking you to the GFA Supporter Shirt&hellip;<br />
    <a href="/#shop">Continue to the shop</a>
  </p>

  <script>
    /* replace() rather than href, so the back button returns the
       visitor to wherever they came from instead of trapping them
       in a redirect loop. */
    window.location.replace('/#shop');
  </script>

</body>
</html>
